<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TSR-Loc 처리 흐름과 Who&amp;When 평가 결과</title>
  <desc id="desc">과업의 성공 조건을 먼저 정하고 실행 기록에서 가장 이른 미복구 위반을 찾는 TSR-Loc의 네 단계와 정확한 단계 일치율을 보여준다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="20" fill="#f8fafc"/>
  <rect x="20" y="20" width="1160" height="720" rx="16" fill="#ffffff" stroke="#d9e0e7" filter="url(#shadow)"/>

  <rect x="42" y="40" width="5" height="48" rx="2.5" fill="#246b67"/>
  <text x="60" y="67" fill="#0f172a" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="32" font-weight="800">TSR-Loc</text>
  <text x="206" y="67" fill="#0f172a" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="28" font-weight="700">과업의 성공 조건으로 실패 위치를 찾는 방법</text>
  <text x="60" y="94" fill="#64748b" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="15">실행 전에 성공 조건을 정하고, 전체 실행 기록에서 가장 이른 미복구 위반을 찾습니다.</text>

  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="12" font-weight="700">
    <rect x="895" y="82" width="83" height="25" rx="12.5" fill="#e8f3f1"/>
    <text x="936.5" y="99" text-anchor="middle" fill="#246b67">추가 학습 없음</text>
    <rect x="986" y="82" width="66" height="25" rx="12.5" fill="#eef2f6"/>
    <text x="1019" y="99" text-anchor="middle" fill="#475569">블랙박스</text>
    <rect x="1060" y="82" width="84" height="25" rx="12.5" fill="#eef2f6"/>
    <text x="1102" y="99" text-anchor="middle" fill="#475569">2단계 추론</text>
  </g>

  <line x1="42" y1="123" x2="1158" y2="123" stroke="#d9e0e7"/>

  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <g transform="translate(42 145)">
      <text x="0" y="0" fill="#246b67" font-size="13" font-weight="800">01</text>
      <text x="0" y="30" fill="#0f172a" font-size="20" font-weight="800">입력</text>
      <text x="0" y="57" fill="#64748b" font-size="14">과업 설명과 에이전트 목록</text>
    </g>
    <path d="M288 186h23m-7-7 7 7-7 7" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(330 145)">
      <text x="0" y="0" fill="#246b67" font-size="13" font-weight="800">02</text>
      <text x="0" y="30" fill="#0f172a" font-size="20" font-weight="800">성공 조건 구성</text>
      <text x="0" y="57" fill="#64748b" font-size="14">실행 기록을 보기 전에</text>
      <text x="0" y="78" fill="#64748b" font-size="14">필수 절차와 위반 기준을 고정</text>
      <line x1="0" y1="103" x2="215" y2="103" stroke="#246b67" stroke-width="3"/>
    </g>
    <path d="M590 186h23m-7-7 7 7-7 7" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(632 145)">
      <text x="0" y="0" fill="#246b67" font-size="13" font-weight="800">03</text>
      <text x="0" y="30" fill="#0f172a" font-size="20" font-weight="800">전체 실행 기록 판정</text>
      <text x="0" y="57" fill="#64748b" font-size="14">위반 이후의 복구 여부를 확인해</text>
      <text x="0" y="78" fill="#64748b" font-size="14">가장 이른 미복구 지점을 탐색</text>
      <line x1="0" y1="103" x2="245" y2="103" stroke="#246b67" stroke-width="3"/>
    </g>
    <path d="M910 186h23m-7-7 7 7-7 7" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(952 145)">
      <text x="0" y="0" fill="#246b67" font-size="13" font-weight="800">04</text>
      <text x="0" y="30" fill="#0f172a" font-size="20" font-weight="800">출력</text>
      <text x="0" y="57" fill="#64748b" font-size="14">책임 에이전트와</text>
      <text x="0" y="78" fill="#64748b" font-size="14">정확한 실패 단계</text>
    </g>
  </g>

  <line x1="42" y1="276" x2="1158" y2="276" stroke="#d9e0e7"/>
  <line x1="600" y1="308" x2="600" y2="602" stroke="#d9e0e7"/>

  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <text x="48" y="320" fill="#0f172a" font-size="21" font-weight="800">전체 평가 · 184개</text>
    <text x="48" y="346" fill="#64748b" font-size="13">정확한 단계 일치율 (%)</text>
    <text x="626" y="320" fill="#0f172a" font-size="21" font-weight="800">HC-long · 23개</text>
    <text x="626" y="346" fill="#64748b" font-size="13">정확한 단계 일치율 (%) · 사후 분석</text>
    <text x="1145" y="346" text-anchor="end" fill="#64748b" font-size="11">1건 = 4.35%p</text>
  </g>

  <!-- Full set chart -->
  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <g stroke="#e5e9ee" stroke-width="1">
      <line x1="82" y1="570" x2="570" y2="570"/>
      <line x1="82" y1="527.8" x2="570" y2="527.8"/>
      <line x1="82" y1="485.6" x2="570" y2="485.6"/>
      <line x1="82" y1="443.3" x2="570" y2="443.3"/>
      <line x1="82" y1="401.1" x2="570" y2="401.1"/>
    </g>
    <g fill="#7b8794" font-size="11" text-anchor="end">
      <text x="74" y="574">0</text>
      <text x="74" y="531.8">10</text>
      <text x="74" y="489.6">20</text>
      <text x="74" y="447.3">30</text>
      <text x="74" y="405.1">40</text>
    </g>

    <rect x="104" y="535.6" width="80" height="34.4" rx="3" fill="#a5adb8"/>
    <rect x="228" y="430.1" width="80" height="139.9" rx="3" fill="#8993a1"/>
    <rect x="352" y="407.1" width="80" height="162.9" rx="3" fill="#e43d2b"/>
    <rect x="476" y="402.5" width="80" height="167.5" rx="3" fill="#63a5dc"/>

    <g fill="#334155" font-size="12" font-weight="800" text-anchor="middle">
      <text x="144" y="526">8.15</text>
      <text x="268" y="420.5">33.15</text>
      <text x="392" y="397.5">38.59</text>
      <text x="516" y="393">39.67</text>
    </g>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="144" y="591">Direct</text>
      <text x="268" y="591">A2P</text>
      <text x="392" y="591"><tspan x="392">TSR-Loc</tspan><tspan x="392" dy="16">과업 정보만</tspan></text>
      <text x="516" y="591"><tspan x="516">TSR-Loc</tspan><tspan x="516" dy="16">정답 보조</tspan></text>
    </g>
  </g>

  <!-- HC-long post-hoc chart -->
  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <g stroke="#e5e9ee" stroke-width="1">
      <line x1="660" y1="570" x2="1145" y2="570"/>
      <line x1="660" y1="515.7" x2="1145" y2="515.7"/>
      <line x1="660" y1="461.4" x2="1145" y2="461.4"/>
      <line x1="660" y1="407.1" x2="1145" y2="407.1"/>
    </g>
    <g fill="#7b8794" font-size="11" text-anchor="end">
      <text x="652" y="574">0</text>
      <text x="652" y="519.7">10</text>
      <text x="652" y="465.4">20</text>
      <text x="652" y="411.1">30</text>
    </g>

    <rect x="700" y="546.4" width="92" height="23.6" rx="3" fill="#8993a1"/>
    <rect x="854" y="428.4" width="92" height="141.6" rx="3" fill="#e43d2b"/>
    <rect x="1008" y="404.8" width="92" height="165.2" rx="3" fill="#63a5dc"/>

    <g fill="#334155" font-size="12" font-weight="800" text-anchor="middle">
      <text x="746" y="537">4.35</text>
      <text x="900" y="418.8">26.09</text>
      <text x="1054" y="395.2">30.43</text>
    </g>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="746" y="591">A2P</text>
      <text x="900" y="591"><tspan x="900">TSR-Loc</tspan><tspan x="900" dy="16">과업 정보만</tspan></text>
      <text x="1054" y="591"><tspan x="1054">TSR-Loc</tspan><tspan x="1054" dy="16">정답 보조</tspan></text>
    </g>
  </g>

  <line x1="42" y1="635" x2="1158" y2="635" stroke="#d9e0e7"/>
  <rect x="42" y="662" width="5" height="45" rx="2.5" fill="#246b67"/>
  <text x="62" y="679" fill="#0f172a" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="15" font-weight="800">핵심 결과</text>
  <text x="62" y="702" fill="#334155" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="14">과업 정보만 사용한 TSR-Loc은 Direct보다 정확한 단계 일치율이 30.43%p 높았습니다.</text>
  <text x="1145" y="702" text-anchor="end" fill="#64748b" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="11">A2P 대비 차이는 통계적으로 유의하지 않음 · p=0.2954</text>
  <text x="1145" y="725" text-anchor="end" fill="#94a3b8" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="10">출처: results/who_and_when_main.csv</text>
</svg>
