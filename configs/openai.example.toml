[data]
generated_step_base = 0

[llm]
backend = "openai_compatible"
model = "gpt-4o"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
temperature = 0.0
max_tokens = 4096
timeout_seconds = 300

[methods.ccv_ablation_no_gt]
max_step_chars = 30000

[methods.ccv_full_trace]
max_step_chars = 30000

[methods.mvbs10]
chunks = 10
beam_k = 3
window_size = 5
stride = 2
overlap_steps = 2
max_candidates = 5
pairwise = true
max_step_chars = 30000
max_chunk_chars = 50000

