[data]
generated_step_base = 0

[llm]
backend = "local_hf"
model = "meta-llama/Llama-3.1-8B-Instruct"
temperature = 0.0
max_tokens = 1024
timeout_seconds = 300
torch_dtype = "float16"
device_map = "auto"
trust_remote_code = false
local_files_only = true
max_input_tokens = 8192
truncation_side = "left"

[methods.ccv_ablation_no_gt]
max_step_chars = 10000

[methods.mvbs10]
chunks = 10
beam_k = 3
window_size = 5
stride = 2
overlap_steps = 2
max_candidates = 5
pairwise = true
max_step_chars = 10000
max_chunk_chars = 12000

