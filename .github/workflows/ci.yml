name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke experiment
        run: >-
          python run_experiment.py
          --config configs/mock.toml
          --data data/sample_who_when.jsonl
          --methods who_when_official_all_at_once,a2p_repo_exact,ccv_ablation_no_gt,mvbs10
          --out outputs/smoke
          --repeats 1
      - name: Public-repository checks
        run: python scripts/check_public_repo.py

